services:
  dashboard:
    build: .
    env_file: .env
    ports: ["8501:8501"]
    volumes: ["./data:/app/data", "./mlflow.db:/app/mlflow.db"]
  api:
    build: .
    env_file: .env
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
  mlflow:
    build: .
    command: mlflow ui --backend-store-uri sqlite:////app/mlflow.db --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]
    volumes: ["./mlflow.db:/app/mlflow.db", "./mlruns:/app/mlruns"]
